name: Flutter - iOS Simulator

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flutter-ios.yml"
      - "apps/fieldops_mobile/**"
      - "!apps/fieldops_mobile/**/*.md"
  push:
    branches: [pollo-movil]
    paths:
      - ".github/workflows/flutter-ios.yml"
      - "apps/fieldops_mobile/**"
      - "!apps/fieldops_mobile/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/fieldops_mobile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode with Swift tools 6.2 support
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | grep -Fqx "Xcode 26.3"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          cache-key: flutter-3.47.7

      - name: Resolve Flutter and CocoaPods packages
        run: flutter pub get --enforce-lockfile

      - name: Confirm the committed lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Static analysis
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Flutter tests
        run: flutter test --reporter expanded

      - name: Build iOS simulator app without signing
        run: flutter build ios --simulator --no-codesign

      - name: Boot an available iPhone simulator and run integration test
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$device_id"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          flutter test integration_test/app_smoke_test.dart -d "$device_id" --reporter expanded

      - name: Confirm the committed CocoaPods lockfile is current
        run: git diff --exit-code -- ios/Podfile.lock

      - name: Collect iOS simulator app and logs
        if: always()
        run: |
          if [ -d build/ios/iphonesimulator/Runner.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/ios-simulator-app.zip"
          fi
          xcrun simctl list devices > "$RUNNER_TEMP/ios-simulators.log"

      - name: Save iOS simulator build and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-${{ github.run_id }}
          path: |
            apps/fieldops_mobile/pubspec.lock
            apps/fieldops_mobile/ios/Podfile.lock
            ${{ runner.temp }}/ios-simulator-app.zip
            ${{ runner.temp }}/ios-simulators.log
          if-no-files-found: ignore
          retention-days: 14
