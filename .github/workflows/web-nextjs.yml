name: Web - Next.js

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/web-nextjs.yml"
      - "apps/fieldops_web/**"
      - "!apps/fieldops_web/**/*.md"
  push:
    branches: [pollo-movil]
    paths:
      - ".github/workflows/web-nextjs.yml"
      - "apps/fieldops_web/**"
      - "!apps/fieldops_web/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/fieldops_web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/fieldops_web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser functional tests
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
        run: npx playwright test --reporter=list,html

      - name: Save Playwright results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-${{ github.run_id }}
          path: |
            apps/fieldops_web/playwright-report/
            apps/fieldops_web/test-results/
          if-no-files-found: ignore
          retention-days: 14
