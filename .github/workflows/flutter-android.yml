name: Flutter - Android

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/flutter-android.yml"
      - "apps/fieldops_mobile/**"
      - "!apps/fieldops_mobile/**/*.md"
  push:
    branches: [pollo-movil]
    paths:
      - ".github/workflows/flutter-android.yml"
      - "apps/fieldops_mobile/**"
      - "!apps/fieldops_mobile/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    # Ubuntu 24.04 runners are currently hanging with QEMU in the Android emulator.
    # Pin to 22.04 while the upstream runner issue remains open.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/fieldops_mobile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space without removing Android SDK
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          preinstalled-runtimes: true
          swap-storage: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
          cache-key: flutter-3.47.7

      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile

      - name: Confirm the committed lockfile is current
        run: git diff --exit-code -- pubspec.lock

      - name: Static analysis
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Reclaim unused preinstalled emulator images
        run: |
          echo "Disk space before Android build:"
          df -h "$GITHUB_WORKSPACE"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk_root" ]; then
            echo "::error::Android SDK was not found at $sdk_root"
            exit 1
          fi
          if [ -n "$sdk_root" ] && [ -d "$sdk_root/system-images" ]; then
            du -sh "$sdk_root/system-images"
            rm -rf -- "$sdk_root/system-images"
          else
            echo "No preinstalled emulator images found at $sdk_root/system-images"
          fi
          echo "Disk space after removing unused preinstalled images:"
          df -h "$GITHUB_WORKSPACE"

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Enable KVM access for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 20
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 4G
          emulator-boot-timeout: 300
          disable-animations: true
          script: cd "$GITHUB_WORKSPACE/apps/fieldops_mobile" && adb logcat -c && adb install -r build/app/outputs/flutter-apk/app-debug.apk && timeout 600s flutter test integration_test/app_smoke_test.dart -d emulator-5554 --reporter expanded

      - name: Collect Android emulator log
        if: always()
        run: |
          if adb get-state >/dev/null 2>&1; then
            adb logcat -d > "$RUNNER_TEMP/android-emulator.log"
          fi

      - name: Save Android build and emulator logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-${{ github.run_id }}
          path: |
            apps/fieldops_mobile/pubspec.lock
            apps/fieldops_mobile/build/app/outputs/flutter-apk/app-debug.apk
            ${{ runner.temp }}/android-emulator.log
          if-no-files-found: ignore
          retention-days: 14
