name: Integration and security

on:
  pull_request:
    branches: [main]
  push:
    branches: [pollo-movil]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all published Git history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP:/reports" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config=/repo/.gitleaks.toml --log-opts=--all \
            --report-path=/reports/gitleaks.json --report-format=json --redact=100 /repo

      - name: Upload redacted secret scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: ignore
          retention-days: 14

  python-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.0"
          cache: pip
          cache-dependency-path: execution/requirements-regression.txt

      - name: Install Python test dependencies
        run: python -m pip install -r execution/requirements-regression.txt

      - name: Run existing pure Python regression tests
        run: |
          python -m unittest -v \
            execution.test_seed_backend_test_data \
            execution.test_run_backend_regression_suite \
            execution.test_web_i18n_coverage \
            execution.test_web_i18n_thai \
            execution.test_generate_supabase_sql_snapshot \
            execution.test_ops_pages_use_function_client \
            execution.test_overtime_page_contract \
            execution.test_owner_role_foundation \
            execution.test_photos_page_structure \
            execution.test_platform_admin \
            execution.test_sync_runtime_env \
            execution.test_web_function_client \
            execution.test_billing_foundation \
            execution.test_endpoint_contracts

      - name: Compile Python source and tests
        run: python -m compileall -q execution
